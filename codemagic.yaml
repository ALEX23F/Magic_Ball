workflows:
  weather-apk:
    name: Magic Ball APK
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install -g @capacitor/cli
          npm install @capacitor/android
      - name: Sync Android and Apply Purple Icon
        script: |
          # 1. Пересоздаем андроид-проект с нуля
          rm -rf android
          npx cap add android
          npx cap sync android

          # 2. Скачиваем фиолетовую иконку
          mkdir -p assets
          curl -L "https://ui-avatars.com/api/?name=A&background=6B21A8&color=fff&size=512&bold=true" -o assets/icon.png

          # 3. Удаляем папку с адаптивными XML-роботами, чтобы они не мешали PNG-иконкам
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # 4. Раскладываем фиолетовую иконку по всем папкам разрешений
          MIPMAP_DIRS=("mipmap-mdpi" "mipmap-hdpi" "mipmap-xhdpi" "mipmap-xxhdpi" "mipmap-xxxhdpi")
          for dir in "${MIPMAP_DIRS[@]}"; do
            mkdir -p android/app/src/main/res/$dir
            cp assets/icon.png android/app/src/main/res/$dir/ic_launcher.png
            cp assets/icon.png android/app/src/main/res/$dir/ic_launcher_round.png
          done

          # 5. ИСПРАВЛЕНИЕ: Переключаем AndroidManifest на использование обычных PNG-иконок вместо XML
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i '' 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher"/g' $MANIFEST_PATH 2>/dev/null || sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher"/g' $MANIFEST_PATH
          sed -i '' 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@mipmap\/ic_launcher_round"/g' $MANIFEST_PATH 2>/dev/null || sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@mipmap\/ic_launcher_round"/g' $MANIFEST_PATH

          echo "✅ Фиолетовая иконка успешно настроена и манифест обновлен!"
      - name: Build Debug APK
        script: |
          cd android
          chmod +x ./gradlew
          export JAVA_HOME=$JAVA_HOME_21_X64
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
