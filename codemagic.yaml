workflows:
  weather-apk:
    name: Magic Ball APK
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install -g @capacitor/cli @capacitor/assets
          npm install @capacitor/android
      - name: Generate Assets and Sync Android
        script: |
          # 1. Создаем временную папку для исходника иконки
          mkdir -p assets
          curl -L "https://ui-avatars.com/api/?name=A&background=6B21A8&color=fff&size=512&bold=true" -o assets/icon-only.png
          cp assets/icon-only.png assets/icon.png

          # 2. Пересоздаем андроид-проект
          rm -rf android
          npx cap add android
          
          # 3. Автоматически генерируем форматы иконок
          npx capacitor-assets generate --android --icon
          
          # 4. Синхронизируем готовую папку www с Android-проектом
          npx cap sync android
          echo "✅ Фиолетовая иконка 'A' сгенерирована во всех Android-форматах!"
      - name: Build Debug APK
        script: |
          cd android
          chmod +x ./gradlew
          export JAVA_HOME=$JAVA_HOME_21_X64
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
