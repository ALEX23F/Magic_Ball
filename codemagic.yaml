workflows:
  weather-apk:
    name: Magic Ball APK
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install -g @capacitor/cli
          npm install @capacitor/android
      - name: Sync Android and Apply Purple Icon
        script: |
          # 1. Пересоздаем андроид-проект с нуля
          rm -rf android
          npx cap add android
          npx cap sync android

          # 2. ГЕНЕРИРУЕМ ИДЕАЛЬНЫЙ ФИОЛЕТОВЫЙ ШАР-8 (БЕЗ ИНТЕРНЕТА)
          mkdir -p assets
          
          # Создаем базовый фиолетовый круглый щит 512x512
          convert -size 512x512 xc:none -fill "#4B0082" -draw "circle 256,256 256,10" assets/icon.png
          
          # Накладываем сверху белый круг поменьше под цифру
          convert assets/icon.png -fill "#FFFFFF" -draw "circle 256,256 256,120" assets/icon.png
          
          # Вписываем по центру черную магическую восьмерку
          convert assets/icon.png -fill "#000000" -pointsize 160 -font Helvetica-Bold -gravity center -draw "text 0,0 '8'" assets/icon.png
          
          # Дублируем получившийся идеальный шар под форматы Capacitor
          cp assets/icon.png assets/icon-only.png
          cp assets/icon.png assets/icon-background.png

          # 3. Удаляем папку с адаптивными XML-роботами, чтобы они не мешали PNG-иконкам
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # 4. Раскладываем фиолетовую иконку по всем папкам разрешений
          MIPMAP_DIRS=("mipmap-mdpi" "mipmap-hdpi" "mipmap-xhdpi" "mipmap-xxhdpi" "mipmap-xxxhdpi")
          for dir in "${MIPMAP_DIRS[@]}"; do
            mkdir -p android/app/src/main/res/$dir
            cp assets/icon.png android/app/src/main/res/$dir/ic_launcher.png
            cp assets/icon.png android/app/src/main/res/$dir/ic_launcher_round.png
          done

          # 5. Переключаем AndroidManifest на использование обычных PNG-иконок вместо XML
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i '' 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher"/g' $MANIFEST_PATH 2>/dev/null || sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher"/g' $MANIFEST_PATH
          sed -i '' 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@mipmap\/ic_launcher_round"/g' $MANIFEST_PATH 2>/dev/null || sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@mipmap\/ic_launcher_round"/g' $MANIFEST_PATH

          echo "✅ Фиолетовый шар-8 успешно сгенерирован и установлен!"
      - name: Build Debug APK
        script: |
          cd android
          chmod +x ./gradlew
          export JAVA_HOME=$JAVA_HOME_21_X64
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
