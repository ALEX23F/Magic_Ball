<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Магический Шар Судьбы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #000;
            background-image: 
                radial-gradient(circle at center, #2b1055 0%, #000 70%),
                radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.1), transparent 40%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* Руны на фоне */
        body::before {
            content: '';
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 25%;
            background-image: 
                linear-gradient(90deg, rgba(168, 85, 247, 0.1) 1px, transparent 1px) 0 0 / 60px 100%,
                radial-gradient(circle at center, rgba(168, 85, 247, 0.05) 10%, transparent 40%),
                linear-gradient(90deg, transparent 50%, rgba(168, 85, 247, 0.1) 50%, rgba(168, 85, 247, 0.1) 60%, transparent 60%) 10px 10px / 40px 40px no-repeat,
                linear-gradient(rgba(168, 85, 247, 0.1) 10%, transparent 10%, transparent 90%, rgba(168, 85, 247, 0.1) 90%) 30px 30px / 20px 20px no-repeat,
                linear-gradient(45deg, rgba(168, 85, 247, 0.1) 50%, transparent 50%) 60px 60px / 20px 20px no-repeat;
            background-repeat: repeat-x;
            opacity: 0.6;
            filter: blur(1px);
        }

        .ball {
            width: 300px; height: 300px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #444, #000);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 -10px 20px rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; position: relative;
            -webkit-tap-highlight-color: transparent; 
            outline: none;
            /* Плавный переход для эффекта нажатия */
            transition: box-shadow 0.3s ease; 
        }

        .ball:active {
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 -5px 15px rgba(0,0,0,0.6), 0 0 40px rgba(168, 85, 247, 0.4);
        }

        .window {
            width: 140px; height: 140px; border-radius: 50%;
            background: radial-gradient(circle, #1e3a8a, #0f172a);
            border: 4px solid #334155;
            display: flex; justify-content: center; align-items: center;
            text-align: center; color: #fff; font-size: 18px; font-weight: bold;
            padding: 15px; box-shadow: inset 0 0 20px #000; text-shadow: 0 0 5px #fff;
            position: relative;
            /* Плавное проявление текста */
            transition: opacity 0.6s ease-in-out; 
        }
