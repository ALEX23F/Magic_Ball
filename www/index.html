<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Магический Шар</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            /* Базовый темный фон */
            background-color: #000000;
            /* Создаем "живой" фон с мистическим сиянием, рунами и фазами Луны через CSS */
            background-image: 
                /* 1. Глубокое фиолетовое сияние в центре */
                radial-gradient(circle at center, rgba(43, 16, 85, 0.7), #000000 70%),
                /* 2. Легкое свечение по краям */
                radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.15), transparent 40%),
                /* 3. Генерация "шума" (звездной пыли) */
                url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3P%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E"),
                /* 4. Слой с фазами Луны (CSS-арт) */
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px) 0 0 / 50px 100%,
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px) 0 0 / 100% 50px;
            background-size: 100% 100%, 100% 100%, auto, 20px 20px, 20px 20px;
            
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* Псевдоэлемент для Лунных фаз (CSS-арт вверху) */
        body::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 60px;
            /* Рисуем фазы Луны тонкими линиями */
            background-image: 
                /* Новолуние */
                radial-gradient(circle at 10% 50%, rgba(168, 85, 247, 0.3) 12px, transparent 13px),
                /* Растущий серп */
                radial-gradient(circle at 30% 50%, rgba(255,255,255,0.1) 12px, transparent 13px),
                /* Первая четверть */
                linear-gradient(90deg, rgba(255,255,255,0.1) 12px, transparent 12px) 50% 50% / 24px 24px no-repeat,
                /* Полнолуние */
                radial-gradient(circle at 70% 50%, rgba(255,255,255,0.2) 12px, transparent 13px),
                /* Убывающий серп */
                radial-gradient(circle at 90% 50%, rgba(255,255,255,0.1) 12px, transparent 13px);
            background-repeat: no-repeat;
            opacity: 0.5;
            filter: blur(1px);
        }

        /* Псевдоэлемент для мистических Рун (CSS-арт внизу с анимацией) */
        body::after {
            content: 'ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚻ ᛁ ᛃ ᛇ ᛈ ᛉ ᛊ ᛋ ᛏ ᛒ ᛖ ᛗ ᛚ ᛜ ᛝ ᛟ ᛞ';
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            font-size: 20px;
            color: rgba(168, 85, 247, 0.2);
            font-family: 'Arial', sans-serif;
            letter-spacing: 15px;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            /* Анимация "Мерцание Рун" */
            animation: runeGlow 4s infinite ease-in-out;
            pointer-events: none; /* Чтобы текст не мешал кликам */
        }

        .ball {
            width: 300px; height: 300px; border-radius: 50%;
            /* Добавим шару легкое фиолетовое свечение снаружи */
            background: radial-gradient(circle at 30% 30%, #444, #000);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 -10px 20px rgba(0,0,0,0.5), 0 0 30px rgba(168, 85, 247, 0.2);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; position: relative;
            transition: box-shadow 0.3s ease;
        }
        
        /* Эффект при наведении/нажатии на шар */
        .ball:active {
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 -5px 15px rgba(0,0,0,0.6), 0 0 50px rgba(168, 85, 247, 0.5);
        }

        .window {
            width: 140px; height: 140px; border-radius: 50%;
            background: radial-gradient(circle, #1e3a8a, #0f172a);
            border: 4px solid #334155;
            display: flex; justify-content: center; align-items: center;
            text-align: center; color: #fff; font-size: 18px; font-weight: bold;
            padding: 15px; box-shadow: inset 0 0 20px #000; text-shadow: 0 0 5px #fff;
        }

        /* Удаляем старую подсказку .hint */

        /* Анимации */
        @keyframes runeGlow {
            0%, 100% { opacity: 0.3; text-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }
            50% { opacity: 1; text-shadow: 0 0 20px rgba(168, 85, 247, 0.8), 0 0 30px rgba(168, 85, 247, 0.6); }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shaking { animation: shake 0.5s; animation-iteration-count: 2; }
    </style>
</head>
<body>
    <div class="ball" onclick="predict()">
        <div class="window" id="answer"><span style="font-size: 40px;">?</span></div>
    </div>
    
    <script>
        const answers = [
            "Бесспорно!", "Это определённо так.", "Никаких сомнений.", "Можешь быть уверен.",
            "Наверняка.", "Хорошие перспективы.", "Знаки говорят — да.", "Да.",
            "Пока не ясно, попробуй снова.", "Спроси позже.", "Лучше не рассказывать.",
            "Сейчас нельзя предсказать.", "Сконцентрируйся и спроси опять.",
            "Даже не думай.", "Мой ответ — нет.", "По моим данным — нет.",
            "Перспективы не очень.", "Весьма сомнительно.", "Звёзды молчат."
        ];
        const ball = document.querySelector('.ball');
        const answerBox = document.getElementById('answer');
        let isShaking = false;
        function predict() {
            if (isShaking) return;
            isShaking = true;
            ball.classList.add('shaking');
            answerBox.style.opacity = '0.3';
            answerBox.innerHTML = '<span style="font-size: 40px;">...</span>';
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            setTimeout(() => {
                ball.classList.remove('shaking');
                const randomAnswer = answers[Math.floor(Math.random() * answers.length)];
                answerBox.textContent = randomAnswer;
                answerBox.style.opacity = '1';
                isShaking = false;
            }, 1000);
        }
    </script>
</body>
</html>
