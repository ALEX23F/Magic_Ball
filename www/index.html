<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Магический Шар</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #000;
            background-image: radial-gradient(circle at center, #1b0c3d 0%, #000000 80%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }

        #magicCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .ball-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .ball {
            width: 280px; height: 280px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #555, #000);
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 -10px 15px rgba(0,0,0,0.7), 0 0 30px rgba(168, 85, 247, 0.15);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; position: relative;
            outline: none;
        }

        .ball:active {
            transform: scale(0.96);
        }

        /* Мягкое плавное покачивание */
        @keyframes magicSway {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-4px, 2px) rotate(-2deg); }
            40% { transform: translate(4px, -3px) rotate(3deg); }
            60% { transform: translate(-5px, -1px) rotate(-3deg); }
            80% { transform: translate(4px, 3px) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        
        .shaking .ball { 
            animation: magicSway 0.9s ease-in-out infinite; 
        }

        /* Окно с ответом (без CSS переходов прозрачности, управляем из JS) */
        .window {
            width: 140px; height: 140px; border-radius: 50%;
            background: radial-gradient(circle, #102a6b, #000 95%);
            border: 3px solid rgba(168, 85, 247, 0.4);
            display: none; /* Изначально полностью выключено */
            justify-content: center; align-items: center;
            text-align: center; color: #fff; font-size: 16px; font-weight: bold;
            padding: 12px; box-shadow: inset 0 0 20px #000, 0 0 15px rgba(168, 85, 247, 0.2);
            text-shadow: 0 0 5px #fff;
            position: relative;
            transition: opacity 0.4s ease;
            opacity: 0;
        }

        .hint { margin-top: 40px; color: #4b5563; font-size: 13px; letter-spacing: 1px; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>

    <canvas id="magicCanvas"></canvas>

    <div class="ball-container" id="magicBall">
        <div class="ball">
            <div class="window" id="answer"></div>
        </div>
    </div>
    
    <div class="hint">Коснись, чтобы узнать судьбу...</div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // --- 1. ДВИЖОК ЛЕТАЮЩИХ РУН ---
            const canvas = document.getElementById('magicCanvas');
            const ctx = canvas.getContext('2d');
            let runesArray = [];
            const runesCount = 40; 
            const runicAlphabet = 'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚻᛁᛃᛇᛈᛉᛊᛋᛏᛒᛖᛗᛚᛜᛝᛟᛞ';

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Rune {
                constructor() { this.init(true); }
                init(isFirstTime = false) {
                    this.x = Math.random() * canvas.width;
                    this.y = isFirstTime ? (Math.random() * canvas.height) : (Math.random() < 0.5 ? 0 : canvas.height);
                    this.symbol = runicAlphabet[Math.floor(Math.random() * runicAlphabet.length)];
                    this.speedX = (Math.random() - 0.5) * 1.0; 
                    this.speedY = (Math.random() - 0.5) * 1.0;
                    this.alpha = 0; 
                    this.maxAlpha = 0.3 + Math.random() * 0.5;
                    this.state = 1;
                    this.size = 20 + Math.random() * 6;
                    this.lifetime = 200 + Math.random() * 200;
                }
                update() {
                    this.x += this.speedX; this.y += this.speedY;
                    if (this.x < 0 || this.x > canvas.width) this.speedX = -this.speedX;
                    if (this.y < 0 || this.y > canvas.height) this.speedY = -this.speedY;

                    if (this.state === 1) {
                        this.alpha += 0.01; if (this.alpha >= this.maxAlpha) this.state = 2;
                    } else if (this.state === 2) {
                        this.lifetime--; if (this.lifetime <= 0) this.state = 3;
                    } else if (this.state === 3) {
                        this.alpha -= 0.01; if (this.alpha <= 0) this.init(false);
                    }
                }
                draw() {
                    if (this.alpha <= 0) return;
                    ctx.save();
                    ctx.fillStyle = `rgba(168, 85, 247, ${this.alpha})`;
                    ctx.font = `bold ${this.size}px Arial`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'rgba(168, 85, 247, 0.6)';
                    ctx.fillText(this.symbol, this.x, this.y);
                    ctx.restore();
                }
            }

            function initRunes() {
                for (let i = 0; i < runesCount; i++) runesArray.push(new Rune());
            }
            function animateRunes() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < runesArray.length; i++) {
                    runesArray[i].update(); runesArray[i].draw();
                }
                requestAnimationFrame(animateRunes);
            }
            initRunes(); animateRunes();


            // --- 2. ИСПРАВЛЕННАЯ ЛОГИКА ШАРА ---
            const answers = [
                "Бесспорно!", "Это определённо так.", "Никаких сомнений.", "Можешь быть уверен.",
                "Наверняка.", "Хорошие перспективы.", "Знаки говорят — да.", "Да.",
                "Пока не ясно, попробуй снова.", "Спроси позже.", "Лучше не рассказывать.",
                "Сейчас нельзя предсказать.", "Сконцентрируйся и спроси опять.",
                "Даже не думай.", "Мой ответ — нет.", "По моим данным — нет.",
                "Перспективы не очень.", "Весьма сомнительно.", "Звёзды молчат."
            ];
            
            const ballContainer = document.getElementById('magicBall');
            const answerBox = document.getElementById('answer');
            let isThinking = false;
            
            ballContainer.addEventListener('click', function() {
                if (isThinking) return;
                isThinking = true;
                
                // 1. Включаем качание
                ballContainer.classList.add('shaking');
                
                // 2. Жестко прячем окно с текстом на время размышления
                answerBox.style.opacity = '0';
                answerBox.style.display = 'none';
                
                if (navigator.vibrate) navigator.vibrate([150, 50, 150]);
                
                // Ждем 2.5 секунды
                setTimeout(() => {
                    // 3. Останавливаем качание
                    ballContainer.classList.remove('shaking');
                    
                    // 4. Записываем новый случайный ответ
                    const randomAnswer = answers[Math.floor(Math.random() * answers.length)];
                    answerBox.textContent = randomAnswer;
                    
                    // 5. Включаем отображение элемента в документе
                    answerBox.style.display = 'flex';
                    
                    // 6. Делаем микро-задержку, чтобы мобильный браузер успел понять, что элемент появился, и включил анимацию прозрачности
                    setTimeout(() => {
                        answerBox.style.opacity = '1';
                    }, 50);
                    
                    if (navigator.vibrate) navigator.vibrate(200);
                    
                    isThinking = false;
                }, 2500); 
            });
        });
    </script>
</body>
</html>
